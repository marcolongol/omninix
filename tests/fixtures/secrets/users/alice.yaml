# Eval-only fixture for tests/config-tests.nix — NEVER decrypted.
#
# The config tests assert that modules/nixos wires this file into
# sops.secrets."user-password-alice" and the user's hashedPasswordFile; they do
# pure evaluation (no VM, no activation), so the contents are an inert
# placeholder shaped like a real sops-encrypted file. A real deployment uses a
# file produced by `sops` (age/pgp-encrypted), with key: hashed-password.
hashed-password: ENC[AES256_GCM,data:placeholder,type:str]
sops:
    version: 3.9.0
