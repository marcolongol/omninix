# Who can decrypt what. Replace the keys with yours (secrets/README.md).
keys:
  - &admin age1replacewithyourpublickeyxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
  - &example-host age1replacewithhostkeyxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
creation_rules:
  # A user's password: readable by you and every host they log in to.
  - path_regex: users/[^/]+\.yaml$
    key_groups:
      - age: [*admin, *example-host]
  # Secrets every host uses: list every host's key here.
  - path_regex: shared\.yaml$
    key_groups:
      - age: [*admin, *example-host]
  # A host's own secrets.
  - path_regex: example-host\.yaml$
    key_groups:
      - age: [*admin, *example-host]
