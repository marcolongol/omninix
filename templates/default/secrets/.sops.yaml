# sops-nix configuration — replace the age public key(s) below with your own.
#
# Generate a personal key:
#   age-keygen -o ~/.config/sops/age/keys.txt
#   age-keygen -y ~/.config/sops/age/keys.txt        # prints the public key
#
# Or derive an age key from a host's SSH ed25519 public key (OmniNix decrypts
# user passwords with the host key at activation — see secretsPath wiring):
#   nix shell nixpkgs#ssh-to-age -c sh -c 'ssh-to-age < /etc/ssh/ssh_host_ed25519_key.pub'
#
# Then encrypt a secret, e.g.:
#   sops secrets/users/your-username.yaml      # add key: hashed-password
keys:
  - &admin age1exampleexampleexampleexampleexampleexampleexampleexamp0000

creation_rules:
  - path_regex: secrets/users/[^/]+\.yaml$
    key_groups:
      - age:
          - *admin
  - path_regex: secrets/[^/]+\.yaml$
    key_groups:
      - age:
          - *admin
